    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #181818;
            font-family: Arial;

        /* THREE.JS (model) VIEWER */

        #viewer {
            margin: 50px auto 0;
            height: 600px;
            border-radius: 15px;
            overflow: hidden;
        }



        /* CONTROL PANEL 4 model */

        .panel {
            position: relative;
            justify-content: center;
            align-items: center;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            background: #ffffffdd;
            padding: 15px;
            border-radius: 12px;
            box-sizing: border-box;
        }


        /* CLASSES FOR TEXT N ALLAT  */

        .coatgrid,
        .markinggrid {
            padding: 20px;
            font-size: 20px;
            font-family: Georgia, serif;
            width: 325px;
            text-align: center;
        }


        .stylesel,
        .coatsel {
            display: flex;
            align-items: center;
            text-align: center;
            font-size: 30px;
            font-family: georgia;
            font-weight: bolder;
            color: rgb(104, 66, 255);
        }

        h1 {
            font-family: courier;
            font-style: italic;
            font-size: 25px;
            display: flex;
            text-align: center;
            align-items: center;
        }


        /* MOBILE  */


        @media (max-width: 600px) {

            #viewer {
                margin: 20px auto 0;
                height: 65vh;
                border-radius: 12px;
            }


            .panel {
                position: fixed;
                left: 10px;
                right: 10px;
                bottom: 10px;
                width: auto;
                display: flex;
                flex-direction: column;
                gap: 8px;
                padding: 10px;
                justify-content: center;
                align-items: center;
                border-radius: 12px;
            }


            .coatgrid,
            .markinggrid {
                padding: 5px;
                font-size: 16px;
            }


            .stylesel,
            .coatsel {
                width: 100%;
                text-align: center;
                font-size: 18px;
                padding: 8px;
                box-sizing: border-box;
            }

        }
    </style>

    <script type="module">

        import * as THREE from
            "https://unpkg.com/three@0.160.0/build/three.module.js";

        import { OrbitControls }
            from
            "https://unpkg.com/three@0.160.0/examples/jsm/controls/OrbitControls.js";

        import { GLTFLoader }
            from
            "https://unpkg.com/three@0.160.0/examples/jsm/loaders/GLTFLoader.js";


        const scene = new THREE.Scene();

        scene.background = new THREE.Color(0x222222);


        const camera = new THREE.PerspectiveCamera(
            45,
            window.innerWidth / window.innerHeight,
            0.1,
            100
        );

        camera.position.set(5.9, 1.5, 0);


        const renderer = new THREE.WebGLRenderer({
            antialias: true
        });

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

        renderer.setPixelRatio(window.devicePixelRatio);

        renderer.outputColorSpace = THREE.SRGBColorSpace;

        document
            .getElementById("viewer")
            .appendChild(renderer.domElement);


        const controls = new OrbitControls(
            camera,
            renderer.domElement
        );

        controls.enableDamping = true;


        scene.add(
            new THREE.AmbientLight(0xffffff, 2)
        );

        const light = new THREE.DirectionalLight(
            0xffffff,
            3
        );

        light.position.set(5, 10, 5);

        scene.add(light);


        // --------------------------------------------------
        // MODEL
        // --------------------------------------------------

        let model;

        const loader = new GLTFLoader();

        loader.load(

            "minecraft_horse__bare_bones.glb",

            (gltf) => {

                model = gltf.scene;

                scene.add(model);

                // Default coat
                changeTexture("https://uce9967b0b1aa164e0d05bfab9ec.dl.dropboxusercontent.com/cd/0/inline/DF8RhlY_COutoMhTRK5uK2wxTkLaRqrtLX8eTLspaZrCiyFkqkBaDAlI79nzn35Mrszw9kvsVBsQR06U3cz0qWVfqjNeILZuVcdWmRmyeQy4U6HdCnQBIeE7UFaLcRdEdZ3Rj6ODkoL9uOm8GM8aDMsh/file#");

            },

            undefined,

            (err) => {

                console.log(err);

            }

        );


        // --------------------------------------------------
        // TEXTURES
        // --------------------------------------------------

        const textureLoader = new THREE.TextureLoader();


        // Currently selected coat
        let currentCoat = null;

        // Currently selected marking
        let currentMarking = null;


        // --------------------------------------------------
        // APPLY TEXTURE TO HORSE
        // --------------------------------------------------

        function applyTexture(texture) {

            if (!model) return;

            texture.flipY = false;
            texture.colorSpace = THREE.SRGBColorSpace;

            model.traverse((child) => {

                if (!child.isMesh) return;

                const materials = Array.isArray(child.material)
                    ? child.material
                    : [child.material];

                materials.forEach((mat) => {

                    mat.map = texture;

                    mat.transparent = true;
                    mat.alphaTest = 0.01;

                    mat.color.set(0xffffff);

                    mat.needsUpdate = true;

                });

            });

        }


        // --------------------------------------------------
        // CHANGE COAT
        // --------------------------------------------------

        function changeTexture(file) {

            textureLoader.load(

                file,

                (texture) => {

                    texture.flipY = false;
                    texture.colorSpace = THREE.SRGBColorSpace;

                    texture.magFilter = THREE.NearestFilter;
                    texture.minFilter = THREE.NearestFilter;
                    texture.generateMipmaps = false;

                    // Remember currently selected coat
                    currentCoat = texture;

                    // If there is a marking selected,
                    // rebuild the combined texture.
                    if (currentMarking) {

                        createCombinedTexture();

                    } else {

                        applyTexture(texture);

                    }

                }

            );

        }


        // --------------------------------------------------
        // CHANGE MARKING
        // --------------------------------------------------

        function changeMarking(file) {

            // Remove marking
            if (file === "none") {

                currentMarking = null;

                if (currentCoat) {

                    applyTexture(currentCoat);

                }

                return;

            }


            textureLoader.load(

                file,

                (texture) => {

                    texture.flipY = false;
                    texture.colorSpace = THREE.SRGBColorSpace;

                    currentMarking = texture;

                    createCombinedTexture();

                }

            );

        }


        // --------------------------------------------------
        // COMBINE COAT + MARKING
        // --------------------------------------------------

        function createCombinedTexture() {

            if (!currentCoat || !currentMarking) return;

            const width = currentCoat.image.width;
            const height = currentCoat.image.height;

            const canvas = document.createElement("canvas");

            canvas.width = width;
            canvas.height = height;

            const ctx = canvas.getContext("2d");

            ctx.imageSmoothingEnabled = false;

            // Coat
            ctx.drawImage(
                currentCoat.image,
                0,
                0,
                width,
                height
            );

            // Marking ON TOP
            ctx.drawImage(
                currentMarking.image,
                0,
                0,
                width,
                height
            );


            // -----------------------------------------
            // Make alpha strictly 0 or 255 (fixing flashy model parts)
            // -----------------------------------------

            const imageData = ctx.getImageData(
                0,
                0,
                width,
                height
            );

            const data = imageData.data;

            for (let i = 3; i < data.length; i += 4) {

                if (data[i] < 128) {
                    data[i] = 0;
                } else {
                    data[i] = 255;
                }

            }

            ctx.putImageData(
                imageData,
                0,
                0
            );


            // -----------------------------------------
            // Create Three.js texture
            // -----------------------------------------

            const combinedTexture =
                new THREE.CanvasTexture(canvas);

            combinedTexture.flipY = false;
            combinedTexture.colorSpace =
                THREE.SRGBColorSpace;

            combinedTexture.magFilter =
                THREE.NearestFilter;

            combinedTexture.minFilter =
                THREE.NearestFilter;

            combinedTexture.generateMipmaps = false;

            combinedTexture.wrapS =
                THREE.ClampToEdgeWrapping;

            combinedTexture.wrapT =
                THREE.ClampToEdgeWrapping;

            combinedTexture.needsUpdate = true;


            applyTexture(combinedTexture);

        }


        // --------------------------------------------------
        // BUTTONS
        // --------------------------------------------------

        // Coat select
        document.getElementById("coatSelect").addEventListener("change", (event) => {

            changeTexture(event.target.value);

        });


        // Marking select
        document.getElementById("markingSelect").addEventListener("change", (event) => {

            changeMarking(event.target.value);

        });


        // --------------------------------------------------
        // RESIZE
        // --------------------------------------------------

        window.addEventListener("resize", () => {

            camera.aspect =
                window.innerWidth /
                window.innerHeight;

            camera.updateProjectionMatrix();

            renderer.setSize(
                window.innerWidth,
                window.innerHeight
            );

        });


        // --------------------------------------------------
        // ANIMATION
        // --------------------------------------------------

        function animate() {

            requestAnimationFrame(animate);

            controls.update();

            renderer.render(
                scene,
                camera
            );

        }

        animate();


    </script>

</body>
