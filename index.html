<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Equestrifun Horse Coats & Styles</title>

    <link rel="stylesheet" href="styles.css">


</head>

<body>

    <div id="viewer">
        <div class="panel">
            <!-- COAT OPTIONS-->
            <label for="coatSelect" class="coatsel">Coat</label>
            <select id="coatSelect" class="coatgrid">
                <option value="">--- Choose a coat ---</option>

                <option
                    value="tackless_horses/horse_black.png">
                    Black
                </option>

                <option
                    value="tackless_horses/horse_black2.png">
                    Black 2 | Optifine
                </option>

                <option
                    value="tackless_horses/horse_black3.png">
                    Black 3 | Optifine
                </option>

                <option
                    value="tackless_horses/horse_brown.png">
                    Brown
                </option>

                <option
                    value="tackless_horses/horse_brown2.png">
                    Brown 2 | Optifine
                </option>


                <option
                    value="tackless_horses/horse_chestnut.png">
                    Chestnut
                </option>

                <option
                    value="tackless_horses/horse_chestnut2.png">
                    Chestnut 2 | Optifine
                </option>

                <option
                    value="tackless_horses/horse_chestnut3.png">
                    Chestnut 3 | Optifine
                </option>


                <option
                    value="tackless_horses/horse_creamy.png">
                    Creamy
                </option>

                <option
                    value="tackless_horses/horse_creamy2.png">
                    Creamy 2 | Optifine
                </option>

                <option
                    value="tackless_horses/horse_creamy3.png">
                    Creamy 3 | Optifine
                </option>

                <option
                    value="tackless_horses/horse_creamy4.png">
                    Creamy 4 | Optifine
                </option>

                <option
                    value="tackless_horses/horse_darkbrown.png">
                    Dark Brown
                </option>

                <option
                    value="tackless_horses/horse_darkbrown2.png">
                    Dark Brown 2 | Optifine
                </option>

                <option
                    value="tackless_horses/horse_gray.png">
                    Gray
                </option>

                <option
                    value="tackless_horses/horse_gray2.png">
                    Gray 2 | Optifine
                </option>

                <option
                    value="tackless_horses/horse_gray3.png">
                    Gray 3 | Optifine
                </option>

                <option
                    value="tackless_horses/horse_white.png">
                    White
                </option>

                <option
                    value="tackless_horses/horse_white2.png">
                    White 2 | Optifine
                </option>

            </select>


            <!-- MARKING OPTIONS -->
            <label for="markingSelect" class="stylesel">Style</label>
            <select id="markingSelect" class="markinggrid">

                <option value="none">-- No marking ---</option>

                <option
                    value="markings/horse_markings_blackdots.png"> 
                    Black Dots
                </option>

                <option
                    value="markings/horse_markings_blackdots2.png">
                    Black Dots 2 | Optifine
                </option>

                <option
                    value="markings/horse_markings_white.png">
                    White
                </option>

                <option
                    value="markings/horse_markings_white2.png">
                    White 2 | Optifine
                </option>

                <option
                    value="markings/horse_markings_white3.png">
                    White 3 | Optifine
                </option>

                <option
                    value="markings/horse_markings_whitedots.png">
                    White Dots
                </option>

                <option
                    value="markings/horse_markings_whitedots2.png">
                    White Dots 2 | Optifine
                </option>

                <option
                    value="markings/horse_markings_whitedots3.png">
                    White Dots 3 | Optifine
                </option>

                <option
                    value="markings/horse_markings_whitefield.png">
                    Whitefield
                </option>

                <option
                    value="markings/horse_markings_whitefield2.png">
                    Whitefield 2 | Optifine
                </option>

                <option
                    value="markings/horse_markings_whitefield3.png">
                    Whitefield 3 | Optifine
                </option>

                <option
                    value="markings/horse_markings_whitefield4.png">
                    Whitefield 4 | Optifine
                </option>

            </select>


            <h1 class="headModel">Coats & Markings Possible in Our TXP</h1>
            <div id="combinationMessage"></div>
        </div>

    </div>

    <script type="importmap">
        {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
            }
        }
    </script>
    <script type="module" src="app.js"></script>


</body>


</html>
